; Memory and execution limits
memory_limit=512M         ; or 1024M if you need more for large apps
max_execution_time=300    ; 0 for unlimited, but 300 is common for dev
max_input_vars=3000
post_max_size=256M        ; or higher if you upload large files
upload_max_filesize=256M  ; or higher for large uploads

; Error reporting
display_errors=On
display_startup_errors=On
error_reporting=E_ALL
log_errors=On

; File uploads
file_uploads=On

; Other useful dev settings
date.timezone=UTC
