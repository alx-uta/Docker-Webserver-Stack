services:
  frontend:
    container_name: PROJECT_NAME-frontend
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run start"
    ports:
      - "5173:5173"
    volumes:
      - ../app:/app
    environment:
      - NODE_ENV=development
    networks:
      - webserver-network

networks:
  webserver-network:
    external: true
